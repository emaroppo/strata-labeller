[project]
name = "strata-labeller"
version = "0.1.0"
description = "Semi-automatic labelling pipeline with Label Studio"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "label-studio-sdk>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    # Declared ahead of use so the dependency graph is enforced by the build
    # from the start rather than at the phase that first imports them.
    "strata-labels",
    "strata-catalog",
    "strata-modelling",
]

[tool.uv.sources]
strata-labels = { workspace = true }
strata-catalog = { workspace = true }
strata-modelling = { workspace = true }

[project.scripts]
auto-labeller = "strata.labeller.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]

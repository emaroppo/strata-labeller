[project]
name = "strata-labeller"
version = "0.1.0"
description = "Semi-automatic labelling pipeline with Label Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "label-studio-sdk>=1.0",
    # Declared ahead of use so the dependency graph is enforced by the build
    # from the start rather than at the phase that first imports them.
    "strata-labels>=0.1,<0.2",
    "strata-catalog>=0.1,<0.2",
    "strata-modelling>=0.1,<0.2",
    "strata-project>=0.1,<0.2",
]


[project.scripts]
strata-labeller = "strata.labeller.cli:app"

# What developing this package alone needs beyond its extras. Inside the
# strata workspace the root's group is used instead.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The same set as every strata package: pinned, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
# The namespace is one project however many repositories hold it, so a
# sibling package sorts with this one and not with the third parties.
known-first-party = ["strata"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call defaults; that is its idiom, not a bug
"strata/*/cli/*.py" = ["B008"]
"strata/*/cli/**/*.py" = ["B008"]

[tool.pyright]
include = ["strata"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
